<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Sessions</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #F9F5F0;
        }

        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #F9F5F0;
        }

        ::-webkit-scrollbar-thumb {
            background: #d6ccbf;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5d4f40;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#F9F5F0',
                            card: '#ffffff',
                            primary: '#5d4f40',
                            primaryHover: '#4a3f33',
                            iconBg: '#ebdcd0',
                            pillBg: '#e2d3c5',
                            textDark: '#332a22',
                            textMuted: '#8b8076',
                            border: '#ede6dd'
                        }
                    },
                    borderRadius: {
                        '3xl': '1.75rem',
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen py-16 px-6">

    <div class="max-w-6xl mx-auto">
        <!-- Header Section -->
        <div class="mb-12">
            <h1 class="text-4xl font-semibold text-brand-primary mb-3">Upcoming Sessions</h1>
            <p class="text-[#8c7f73] text-lg font-light">Join a session that resonates with you. All sessions are
                moderated by licensed professionals.</p>
        </div>

        <!-- Cards Container -->
        <div id="sessions-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Cards injected via JavaScript -->
        </div>
    </div>

    <script>
        const sessions = [
            {
                title: 'Anxiety Support Group',
                description: 'A safe space to share experiences and coping strategies for anxiety management.',
                date: 'Monday, March 2',
                time: '18:00',
                duration: '60 minutes',
                participants: 7,
                maxParticipants: 12,
                moderator: 'Dr. Sarah Johnson',
                isFree: true
            },
            {
                title: 'Depression Recovery Circle',
                description: 'Connect with others on their journey to overcome depression and find hope.',
                date: 'Tuesday, March 3',
                time: '19:00',
                duration: '90 minutes',
                participants: 11,
                maxParticipants: 15,
                moderator: 'Dr. Michael Chen',
                isFree: true
            },
            {
                title: 'Mindfulness & Meditation',
                description: 'Learn and practice mindfulness techniques together in a supportive environment.',
                date: 'Monday, March 2',
                time: '20:00',
                duration: '45 minutes',
                participants: 4,
                maxParticipants: 10,
                moderator: 'Dr. Emma Davis',
                isFree: true
            },
            {
                title: 'Relationship Issues Forum',
                description: 'Discuss relationship challenges and learn healthy communication patterns.',
                date: 'Wednesday, March 4',
                time: '17:00',
                duration: '75 minutes',
                participants: 8,
                maxParticipants: 12,
                moderator: 'Dr. James Wilson',
                isFree: true
            }
        ];

        function renderSessions() {
            const container = document.getElementById('sessions-container');
            container.innerHTML = '';

            sessions.forEach(session => {
                const card = document.createElement('div');
                // The card has round corners (3xl) and subtle shadow
                card.className = 'bg-brand-card rounded-3xl p-8 shadow-sm border border-brand-border/60 relative flex flex-col justify-between transition-transform duration-300 hover:-translate-y-1 hover:shadow-md';

                card.innerHTML = `
                    <div>
                        <!-- Top Header with Icon -->
                        <div class="flex justify-between items-start mb-4">
                            <h2 class="text-2xl font-semibold text-brand-textDark pr-4 leading-tight">${session.title}</h2>
                            <div class="w-12 h-12 flex-shrink-0 bg-brand-iconBg rounded-full flex items-center justify-center text-brand-primary">
                                <i class="fa-solid fa-users text-lg"></i>
                            </div>
                        </div>
                        
                        <!-- Description -->
                        <p class="text-[#7c7268] text-sm/relaxed mb-8 font-light">${session.description}</p>
                        
                        <!-- Details (Date, Time, Participants) -->
                        <div class="space-y-3.5 mb-8">
                            <div class="flex items-center text-brand-textMuted text-[15px]">
                                <i class="fa-regular fa-calendar-alt w-8 text-left text-lg"></i>
                                <span>${session.date}</span>
                            </div>
                            <div class="flex items-center text-brand-textMuted text-[15px]">
                                <i class="fa-regular fa-clock w-8 text-left text-lg"></i>
                                <span>${session.time} <span class="text-[#968a7f]">(${session.duration})</span></span>
                            </div>
                            <div class="flex items-center text-brand-textMuted text-[15px]">
                                <i class="fa-solid fa-user-group w-8 text-left text-base"></i>
                                <span>${session.participants}/${session.maxParticipants} participants</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="relative pb-4">
                        <!-- Horizontal Divider -->
                        <hr class="border-[#eae3db] mb-5">
                        
                        <!-- Moderator and Button Row -->
                        <div class="flex justify-between items-end mb-4">
                            <div>
                                <p class="text-[13px] text-[#9a8e82] mb-1 font-light tracking-wide">Moderator</p>
                                <p class="font-medium text-brand-textDark text-[15px]">${session.moderator}</p>
                            </div>
                            <button class="bg-brand-primary hover:bg-brand-primaryHover text-white px-7 py-2.5 rounded-[12px] text-sm font-medium transition-colors shadow-sm">
                                Join Session
                            </button>
                        </div>
                        
                        <!-- Middle Bottom Badge (pill) -->
                        ${session.isFree ?\`
                        <!-- We use an absolute positioning trick to put it directly centered at the bottom of the card padding, 
                             or slightly overlapping the card border inside if wanted. In the design it looks like it sits at bottom center. -->
                        <div class="absolute left-1/2 -bottom-2 -translate-x-1/2">
                            <div class="bg-brand-pillBg text-brand-primary text-[13px] font-semibold px-5 py-1.5 rounded-full flex items-center gap-2 shadow-sm border border-[#d6c7b7]/50 whitespace-nowrap">
                                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                                Free
                            </div>
                        </div>
                        \` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', renderSessions);
    </script>
</body>

</html>
